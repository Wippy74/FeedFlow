services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrations:
    image: migrate/migrate:v4.19.1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./internal/database/migrations/sql:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
      - up
    restart: "no"

  redis:
    image: redis:7-alpine
    environment:
      REDIS_HOST: ${REDIS_HOST:-localhost}
      REDIS_PORT: ${REDIS_PORT:-6379}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  notification-db:
    profiles: ["app"]
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${NOTIFICATION_DB_USER:-notification}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification_dev}
      POSTGRES_DB: ${NOTIFICATION_DB_NAME:-notification}
    ports:
      - "127.0.0.1:${NOTIFICATION_DB_PORT:-5433}:5432"
    volumes:
      - notification-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOTIFICATION_DB_USER:-notification} -d ${NOTIFICATION_DB_NAME:-notification}"]
      interval: 5s
      timeout: 5s
      retries: 10

  notification-migrations:
    profiles: ["app"]
    image: migrate/migrate:v4.19.1
    depends_on:
      notification-db:
        condition: service_healthy
    volumes:
      - ./internal/notification/migrations/sql:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${NOTIFICATION_DB_USER:-notification}:${NOTIFICATION_DB_PASSWORD:-notification_dev}@notification-db:5432/${NOTIFICATION_DB_NAME:-notification}?sslmode=disable
      - up
    restart: "no"

  api:
    profiles: ["app"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    build:
      context: .
      args:
        APP: api
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt/private.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt/public.pem
      JWT_KEY_ID: ${JWT_KEY_ID}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      API_HTTP_ADDR: :8082
    volumes:
      - ./.secrets/jwt:/run/secrets/jwt:ro
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_started

  notification-api:
    profiles: ["app"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    build:
      context: .
      args:
        APP: notification-api
    environment:
      NOTIFICATION_DATABASE_URL: postgres://${NOTIFICATION_DB_USER:-notification}:${NOTIFICATION_DB_PASSWORD:-notification_dev}@notification-db:5432/${NOTIFICATION_DB_NAME:-notification}?sslmode=disable
      NOTIFICATION_HTTP_ADDR: :8081
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt/public.pem
      JWT_KEY_ID: ${JWT_KEY_ID}
      JWT_ISSUER: ${JWT_ISSUER}
    volumes:
      - ./.secrets/jwt/public.pem:/run/secrets/jwt/public.pem:ro
    depends_on:
      notification-migrations:
        condition: service_completed_successfully

  requests-relay:
    profiles: ["app"]
    build:
      context: .
      args:
        APP: outbox-relay
    environment:
      RELAY_SOURCE: requests
      RELAY_DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
      KAFKA_BROKERS: kafka:19092
    depends_on:
      migrations:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  dispatch-relay:
    profiles: ["app"]
    build:
      context: .
      args:
        APP: outbox-relay
    environment:
      RELAY_SOURCE: dispatch
      RELAY_DATABASE_URL: postgres://${NOTIFICATION_DB_USER:-notification}:${NOTIFICATION_DB_PASSWORD:-notification_dev}@notification-db:5432/${NOTIFICATION_DB_NAME:-notification}?sslmode=disable
      KAFKA_BROKERS: kafka:19092
    depends_on:
      notification-migrations:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  notifier:
    profiles: ["app"]
    build:
      context: .
      args:
        APP: notifier
    environment:
      NOTIFICATION_DATABASE_URL: postgres://${NOTIFICATION_DB_USER:-notification}:${NOTIFICATION_DB_PASSWORD:-notification_dev}@notification-db:5432/${NOTIFICATION_DB_NAME:-notification}?sslmode=disable
      KAFKA_BROKERS: kafka:19092
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-10s}
    depends_on:
      notification-migrations:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  gateway:
    profiles: ["app"]
    build:
      context: .
      args:
        APP: gateway
    environment:
      GATEWAY_ADDR: :8080
      GATEWAY_API_URL: http://api:8082
      GATEWAY_NOTIFICATION_URL: http://notification-api:8081
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    depends_on:
      - api
      - notification-api

  kafka:
    profiles: ["app", "kafka"]
    image: apache/kafka:4.1.2
    hostname: kafka
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  kafka-init:
    profiles: ["app", "kafka"]
    image: apache/kafka:4.1.2
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./deploy/kafka/create-topics.sh:/opt/feedflow/create-topics.sh:ro
    entrypoint: ["/bin/sh", "/opt/feedflow/create-topics.sh"]
    restart: "no"

volumes:
  pgdata:
  notification-pgdata:
  redis-data:
  kafka-data:
